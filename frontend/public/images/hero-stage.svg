      <circle cx="8.5" cy="-3" r="7.5" fill="currentColor"/>
      <circle cx="5.5" cy="7.5" r="7.5" fill="currentColor"/>
      <circle cx="-5.5" cy="7.5" r="7.5" fill="currentColor"/>
      <circle cx="-8.5" cy="-3" r="7.5" fill="currentColor"/>
