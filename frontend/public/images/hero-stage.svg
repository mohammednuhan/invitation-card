      <stop offset="0.5" stop-color="#d9a24a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d9a24a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb">
      <stop offset="0" stop-color="#ffe9bd" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#f3cf87" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f3cf87" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9edc9"/>
      <stop offset="0.42" stop-color="#e3b54a"/>
      <stop offset="1" stop-color="#9c6a25"/>
    </linearGradient>

    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2f22"/>
      <stop offset="0.16" stop-color="#17573f"/>
      <stop offset="0.32" stop-color="#0b3527"/>
      <stop offset="0.5" stop-color="#1b6146"/>
      <stop offset="0.68" stop-color="#0a3024"/>
      <stop offset="0.86" stop-color="#154e39"/>
      <stop offset="1" stop-color="#072019"/>
    </linearGradient>

    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5c44"/>
      <stop offset="0.55" stop-color="#0f3d2e"/>
      <stop offset="1" stop-color="#07251a"/>
    </linearGradient>

    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.6" stop-color="#f4e8cf"/>
      <stop offset="1" stop-color="#e2d0ad"/>
