<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03130d"/>
      <stop offset="0.42" stop-color="#0a2c20"/>
      <stop offset="1" stop-color="#020e09"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.6" r="0.55">
